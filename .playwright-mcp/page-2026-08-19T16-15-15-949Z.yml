      - article [ref=e104]:
        - generic [ref=e105]:
          - heading "When Rain Arrives, the City Invites a New Journey" [level=4] [ref=e108]
          - generic [ref=e110]:
            - paragraph [ref=e111]: The rainy season has its own rhythm, damp streets reflecting night lights, afternoon showers, or brief moments seeking unexpected shelter in a quiet corner. Sometimes, the best journeys are the ones unplanned.
            - paragraph [ref=e112]:
              - text: We extend our heartfelt gratitude to everyone who joined us for the
              - strong [ref=e113]: BAC Passport Winter Edition
              - text: and gave this project such a warm reception. Today, we see a vibrant community of people who love engaging with art, discovering new spaces, and experiencing the city through stories, alongside organizations dedicated to cultivating diverse audiences. The BAC Passport has become a modest record of the relationships between people, art, and the city and we hope you will continue to journey with us in every upcoming edition.
            - paragraph [ref=e114]: Though the Winter Edition has come to a close, our activities continue. BAC is preparing upcoming events with our partners and supporters, including guided art tours and walks through historic neighborhoods, with limited spots available per activity.
            - paragraph [ref=e115]:
              - text: Stay tuned for news and updates across all our channels. For those awaiting the next journey, the next edition of the
              - strong [ref=e116]: BAC Passport
              - text: will be returning soon.
            - paragraph [ref=e117]: The city still holds many more stories to tell.
            - paragraph [ref=e118]: See you again soon.
