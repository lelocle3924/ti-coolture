openapi: 3.0.3
info:
  title: Portal Product Actions API - Stock Toggle
  version: 1.0.0
  description: API extension for shop partners to toggle product out-of-stock status.
paths:
  /api/portal/product-actions:
    post:
      summary: Perform product lifecycle and status actions
      description: Allows authenticated shop owners to toggle visibility, cancel requests, and toggle out-of-stock status.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [toggle_visibility, toggle_stock, cancel_upload_request, cancel_edit_request]
                productId:
                  type: string
                  format: uuid
                isOutOfStock:
                  type: boolean
                  description: Required when action is toggle_stock.
                hidden:
                  type: boolean
                  description: Required when action is toggle_visibility.
                requestId:
                  type: string
                  format: uuid
                  description: Required when action is cancel_edit_request.
      responses:
        '200':
          description: Action succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Đã cập nhật trạng thái hết hàng cho sản phẩm."
                  product:
                    type: object
                    properties:
                      id:
                        type: string
                      name_vi:
                        type: string
                      is_out_of_stock:
                        type: boolean
                      status:
                        type: string
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (product belongs to another shop)
        '500':
          description: Internal server error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
